apiVersion: apps/v1
kind: Deployment
metadata:
  name: app02-compute
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app02-compute
  template:
    metadata:
      labels:
        app: app02-compute
    spec:
      containers:
        - name: app02
          image: ghcr.io/phelun/weekend-app02:c5da025432cbe25a8f93e2f7e40e87f5dcadc181
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
